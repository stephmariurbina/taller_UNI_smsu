# Nombre del workflow que aparecerá en la pestaña Actions de GitHub
name: CI/CD Pipeline

# Define cuándo se ejecutará este workflow
on:
  # Se ejecuta cuando hay un push a las ramas especificadas
  push:
    branches:
      - main # Rama principal
      - develop # Rama de desarrollo (opcional, puedes eliminarla si no la usas)

  # Se ejecuta cuando se crea un Pull Request hacia estas ramas
  pull_request:
    branches:
      - main
      - develop

# Define las variables de entorno globales para todos los jobs
env:
  NODE_VERSION: '20.x' # Versión de Node.js a utilizar

# Define los trabajos (jobs) que se ejecutarán
jobs:
  # ============================================
  # JOB 1: LINTING Y VERIFICACIÓN DE CÓDIGO
  # ============================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest # Sistema operativo donde se ejecutará

    steps:
      # Descarga el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Configura Node.js en el runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm' # Cachea dependencias para acelerar builds

      # Instala dependencias
      - name: Install dependencies
        run: npm ci

      # Ejecuta ESLint
      - name: Run ESLint
        run: npm run lint

  # ============================================
  # JOB 2: BUILD DEL PROYECTO
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint # Este job espera a que 'lint' termine exitosamente

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Genera el cliente de Prisma
      - name: Generate Prisma Client
        run: npx prisma generate

      # Compila la app NestJS
      - name: Build project
        run: npm run build

      # Guarda artefactos
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ============================================
  # JOB 3: TESTS UNITARIOS
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Tests unitarios
      - name: Run unit tests
        run: npm run test -- --passWithNoTests

      # Cobertura
      - name: Run tests with coverage
        run: npm run test:cov -- --passWithNoTests

      # Sube reporte de cobertura
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # JOB 4: NOTIFICACIÓN FINAL (OPCIONAL)
  # ============================================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          echo "Pipeline execution completed!"
          echo "Deploy status: ${{ needs.deploy.result }}"
